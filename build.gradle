plugins {
    id 'maven-publish'
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false

    // https://github.com/Fallen-Breath/yamlang
    id 'me.fallenbreath.yamlang' version '1.5.0'
}

// No remap on 26.1+
def noRemap = sc.current.parsed.matches('>=26.1')
if (noRemap) {
    apply plugin: 'dev.architectury.loom-no-remap'
} else {
    apply plugin: 'dev.architectury.loom'
}

def mod_brand = (loom.platform.get() as String).toLowerCase()
assert mod_brand in ['fabric', 'neoforge']
assert sc.current.project.endsWith('-' + mod_brand)

repositories {
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url = 'https://maven.parchmentmc.org' } // Parchment
    maven { url = 'https://maven.neoforged.net/releases' } // NeoForge
    maven { url = 'https://neoforged.forgecdn.net/' } // Another NeoForge Maven
    maven { url = 'https://jitpack.io' } // GitHub Repo (for Two Slices)
    maven { url = "https://api.modrinth.com/maven" } // Modrinth (for YACL)
}

// https://github.com/FabricMC/fabric-loader/issues/783
if (!noRemap) {
    configurations {
        modApi {
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (!noRemap) {
        mappings loom.layered() {
            officialMojangMappings()
            if (project.parchment_version.size() > 0) {
                parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
            }
        }
    }

    if (mod_brand == 'fabric') {
        if (noRemap) {
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        } else {
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        }

        if (project.findProperty('mod_menu_version')?.toString()?.size() > 0) {
            if (noRemap) {
                api "com.terraformersmc:modmenu:${project.mod_menu_version}"
            } else {
                modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"
            }
        }
    } else if (mod_brand == 'neoforge') {
        neoForge "net.neoforged:neoforge:${project.neoforge_version}"
    }

    if (project.findProperty('cloth_config_version')?.toString()?.size() > 0) {
        if (noRemap) {
            api("me.shedaniel.cloth:cloth-config-${mod_brand}:${project.cloth_config_version}") {
                if (mod_brand == 'fabric') {
                    exclude group: "net.fabricmc.fabric-api"
                }
            }
        } else {
            modApi("me.shedaniel.cloth:cloth-config-${mod_brand}:${project.cloth_config_version}") {
                if (mod_brand == 'fabric') {
                    exclude group: "net.fabricmc.fabric-api"
                }
            }
        }
    }

    if (project.findProperty('yacl_version')?.toString()?.size() > 0) {
        if (noRemap) {
            api "maven.modrinth:yacl:${project.yacl_version}-${mod_brand}"
        } else {
            modApi "maven.modrinth:yacl:${project.yacl_version}-${mod_brand}"
        }
    }


    // https://github.com/sshtools/two-slices
    if (noRemap) {
        implementation 'com.sshtools:two-slices:0.9.4'
    } else {
        modImplementation 'com.sshtools:two-slices:0.9.4'
    }
    include 'com.sshtools:two-slices:0.9.4'

    include(annotationProcessor(implementation("io.github.llamalad7:mixinextras-${mod_brand}:0.4.0")))
}

loom {
    runs {
        client {
            // to make sure it generates all "Minecraft Client (:subproject_name)" applications
            ideConfigGenerated = true
            runDir '../../run'
            vmArgs '-Dmixin.debug.export=true'
        }
    }
}

tasks.register('runLiteClient', Exec) {
    group = 'loom'
    description = 'Run client with CurseForge-compliant (lite) configuration'
    def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
    def gradlewFile = new File(rootProject.rootDir, isWindows ? 'gradlew.bat' : 'gradlew')
    commandLine gradlewFile.absolutePath, ":${project.name}:runClient", '-Plite_version'
}

String FABRIC_API_MOD_ID = sc.current.parsed.matches('>=1.18') ? 'fabric-api' : 'fabric'
String CLOTH_CONFIG_MOD_ID = sc.current.parsed.matches('>=1.18') ? 'cloth-config' : 'cloth-config2'

JavaVersion JAVA_COMPATIBILITY =
        sc.current.parsed.matches('>=26.1') ? JavaVersion.VERSION_25 :
                sc.current.parsed.matches('>=1.20.5') ? JavaVersion.VERSION_21 :
                        sc.current.parsed.matches('>=1.18') ? JavaVersion.VERSION_17 :
                                sc.current.parsed.matches('>=1.17') ? JavaVersion.VERSION_16 :
                                        JavaVersion.VERSION_1_8

java {
    // These define the java compatibility of the artifacts
    sourceCompatibility = JAVA_COMPATIBILITY
    targetCompatibility = JAVA_COMPATIBILITY
}

version = 'v' + project.mod_version + (rootProject.hasProperty('lite_version') ? '-lite' : '') + '+' + project.minecraft_version + '-' + mod_brand
group = project.maven_group
base.archivesName = project.archives_base_name

processResources {
    def modProperties = [
            "id"                  : project.mod_id,
            "version"             : project.mod_version,
            "minecraft_dependency": project.minecraft_dependency,
    ]
    inputs.properties(modProperties)

    def good_files = [] as Set
    def all_files = [] as Set
    [
            'fabric'  : ['fabric.mod.json'],
            'neoforge': ['META-INF', 'META-INF/neoforge.mods.toml', 'pack.mcmeta'],
    ].forEach { brand, paths ->
        all_files.addAll(paths)
        if (brand == mod_brand) {
            good_files.addAll(paths)
        }
    }
    all_files.forEach { it2 ->
        def path = it2 as String
        if (good_files.contains(path)) {
            filesMatching(path) {
                expand modProperties
            }
        } else {
            exclude path
        }
    }

    filesMatching('chattools.mixins.json') {
        filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${JAVA_COMPATIBILITY.ordinal() + 1}") }
    }
    filesMatching('fabric.mod.json') {
        filter { s -> s.replace('{{FABRIC_API}}', FABRIC_API_MOD_ID) }
        filter { s -> s.replace('{{CLOTH_CONFIG}}', CLOTH_CONFIG_MOD_ID) }
    }
}

yamlang {
    targetSourceSets = [sourceSets.main]
    inputDir = 'assets/chattools/lang'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}
